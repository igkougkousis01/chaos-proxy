name: Bug report
description: Chaos Proxy did something other than what it documents.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. See
        [SECURITY.md](https://github.com/igkougkousis01/chaos-proxy/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Chaos Proxy version
      description: Output of `chaos-proxy --version`.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.12.0
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 / Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command and config
      description: The command you ran, and the `chaos.yml` in effect if there was one.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the output, including any error, exactly as printed.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest set of steps that shows the problem. `--seed` makes a run repeatable.
    validations:
      required: true
